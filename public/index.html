<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NTD’s</title>
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NTD’s">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="login-card">
      <img src="/icons/icon.svg" alt="" width="56" height="56">
      <h1>NTD’s</h1>
      <p>Nic’s To-Do’s – Aufgaben, Termine und Erinnerungen.</p>
      <a class="btn primary big" href="/auth/login">Mit Google anmelden</a>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="/icons/icon.svg" alt="" width="26" height="26"><span>NTD’s</span></div>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Suchen" autocomplete="off"></label>
      <nav class="nav" id="nav-main"></nav>
      <div class="nav-head"><span>Projekte</span><button class="icon-btn sm" id="add-project" title="Projekt hinzufügen" aria-label="Projekt hinzufügen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <nav class="nav" id="nav-projects"></nav>
      <div class="nav-head" id="labels-head"><span>Labels</span></div>
      <nav class="nav" id="nav-labels"></nav>
      <div class="sidebar-foot">
        <a href="#/completed" class="nav-item" data-route="completed"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span>Erledigt</span></a>
        <a href="#/settings" class="nav-item" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Einstellungen</span></a>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="titles"><h1 id="view-title"></h1><div id="view-sub" class="sub"></div></div>
        <button class="sync" id="sync" type="button"></button>
        <div class="top-actions" id="top-actions"></div>
        <button class="btn primary add-btn" id="quick-add-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Aufgabe</span></button>
      </header>
      <div class="content" id="content"></div>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
    <button class="fab" id="fab" aria-label="Aufgabe hinzufügen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <div class="drawer" id="drawer" aria-hidden="true"><div class="drawer-panel" id="drawer-panel"></div></div>

  <div class="modal" id="quick-add" aria-hidden="true">
    <form class="qa-card" id="qa-form" autocomplete="off">
      <input id="qa-input" placeholder="z. B. Zahnarzt anrufen morgen 15 Uhr p1 #Privat 15min" enterkeyhint="done">
      <textarea id="qa-notes" rows="2" placeholder="Beschreibung (optional)"></textarea>
      <div class="qa-tokens" id="qa-tokens"></div>
      <div class="qa-foot">
        <span class="hint">Datum, Uhrzeit, <b>p1–p4</b>, <b>#Projekt</b>, <b>@Label</b>, <b>30min</b>, <b>jeden Montag</b></span>
        <div class="qa-btns"><button type="button" class="btn" id="qa-cancel">Abbrechen</button><button type="submit" class="btn primary">Hinzufügen</button></div>
      </div>
    </form>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
